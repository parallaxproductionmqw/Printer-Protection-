   name: Build
   on:
     push:
     workflow_dispatch:
   jobs:
     build:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: '25'
             cache: maven
         - run: unzip -q printerguard-v1.0-source.zip
         - run: mvn -B clean package
           working-directory: printerguard
         - uses: actions/upload-artifact@v4
           with:
             name: PrinterGuard
             path: printerguard/target/*.jar
